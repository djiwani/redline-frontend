<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redline — AI Car Marketplace</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #e8192c;
    --red-dark: #c0141f;
    --black: #0f0f0f;
    --gray-900: #1a1a1a;
    --gray-700: #3a3a3a;
    --gray-500: #6b6b6b;
    --gray-300: #c8c8c8;
    --gray-100: #f4f4f4;
    --white: #ffffff;
    --border: #e8e8e8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--white);
    color: var(--black);
    min-height: 100vh;
  }

  /* NAV */
  nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 0 48px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .nav-logo {
    display: flex;
    align-items: baseline;
    gap: 2px;
    text-decoration: none;
  }

  .nav-logo-text {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    color: var(--black);
    letter-spacing: 2px;
  }

  .nav-logo-dot {
    width: 8px;
    height: 8px;
    background: var(--red);
    border-radius: 50%;
    margin-left: 2px;
    margin-bottom: 6px;
  }

  .nav-right {
    display: flex;
    align-items: center;
    gap: 24px;
  }

  .nav-user {
    font-size: 13px;
    color: var(--gray-500);
    font-family: 'DM Mono', monospace;
  }

  .btn-outline {
    border: 1.5px solid var(--border);
    background: none;
    color: var(--black);
    padding: 8px 20px;
    border-radius: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.15s;
  }

  .btn-outline:hover {
    border-color: var(--black);
  }

  .btn-red {
    background: var(--red);
    color: var(--white);
    border: none;
    padding: 8px 20px;
    border-radius: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.15s;
  }

  .btn-red:hover { background: var(--red-dark); }

  /* HERO */
  .hero {
    background: var(--black);
    color: var(--white);
    padding: 80px 48px;
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: 'REDLINE';
    position: absolute;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 320px;
    color: rgba(255,255,255,0.03);
    right: -40px;
    top: -40px;
    letter-spacing: 10px;
    pointer-events: none;
    line-height: 1;
  }

  .hero-tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(232,25,44,0.15);
    border: 1px solid rgba(232,25,44,0.3);
    color: #ff6b7a;
    padding: 6px 14px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 500;
    font-family: 'DM Mono', monospace;
    margin-bottom: 24px;
    letter-spacing: 0.5px;
  }

  .hero-tag::before {
    content: '';
    width: 6px;
    height: 6px;
    background: var(--red);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .hero h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(56px, 8vw, 96px);
    line-height: 0.95;
    letter-spacing: 2px;
    margin-bottom: 20px;
  }

  .hero h1 span { color: var(--red); }

  .hero-sub {
    font-size: 16px;
    color: rgba(255,255,255,0.5);
    font-weight: 300;
    max-width: 480px;
    line-height: 1.6;
    margin-bottom: 36px;
  }

  .hero-stats {
    display: flex;
    gap: 48px;
  }

  .stat-val {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    color: var(--white);
    letter-spacing: 1px;
  }

  .stat-label {
    font-size: 11px;
    color: rgba(255,255,255,0.35);
    font-family: 'DM Mono', monospace;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* LISTINGS */
  .listings-section {
    padding: 48px;
  }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
  }

  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    letter-spacing: 1px;
  }

  .listings-count {
    font-size: 13px;
    color: var(--gray-500);
    font-family: 'DM Mono', monospace;
  }

  .listings-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 24px;
  }

  .car-card {
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.2s;
    text-decoration: none;
    color: inherit;
    display: block;
    animation: fadeUp 0.4s ease both;
  }

  .car-card:hover {
    border-color: var(--gray-300);
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(0,0,0,0.08);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .car-image {
    width: 100%;
    height: 180px;
    background: var(--gray-100);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .car-image-placeholder {
    font-size: 64px;
    opacity: 0.4;
  }

  .car-year-badge {
    position: absolute;
    top: 12px;
    left: 12px;
    background: var(--black);
    color: var(--white);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 4px;
    font-weight: 500;
  }

  .car-body {
    padding: 18px 20px 20px;
  }

  .car-make {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--red);
    font-family: 'DM Mono', monospace;
    margin-bottom: 4px;
  }

  .car-model {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    line-height: 1;
  }

  .car-desc {
    font-size: 13px;
    color: var(--gray-500);
    line-height: 1.5;
    margin-bottom: 16px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .car-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  .car-price {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 0.5px;
    color: var(--black);
  }

  .car-mileage {
    font-size: 12px;
    color: var(--gray-500);
    font-family: 'DM Mono', monospace;
  }

  .car-color-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 1px solid var(--border);
    display: inline-block;
    margin-right: 4px;
  }

  /* LOADING */
  .loading {
    text-align: center;
    padding: 80px 48px;
    color: var(--gray-500);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
  }

  .loading-spinner {
    width: 32px;
    height: 32px;
    border: 2px solid var(--border);
    border-top-color: var(--red);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ERROR */
  .error-state {
    text-align: center;
    padding: 80px 48px;
  }

  .error-state h3 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    margin-bottom: 8px;
  }

  .error-state p {
    color: var(--gray-500);
    font-size: 14px;
  }

  /* AUTH BANNER */
  .auth-banner {
    background: var(--gray-100);
    border-top: 1px solid var(--border);
    padding: 16px 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .auth-banner p {
    font-size: 14px;
    color: var(--gray-700);
  }

  .auth-banner span {
    color: var(--red);
    font-weight: 600;
  }
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">
    <span class="nav-logo-text">Redline</span>
    <div class="nav-logo-dot"></div>
  </a>
  <div class="nav-right">
    <span class="nav-user" id="navUser"></span>
    <a href="/messages.html" class="btn-outline" id="navNegotiations" style="display:none">My Negotiations</a>
    <a href="/login.html" class="btn-outline" id="loginBtn">Sign in</a>
    <button class="btn-red" id="logoutBtn" style="display:none" onclick="signOut()">Sign out</button>
  </div>
</nav>

<div class="hero">
  <div class="hero-tag">AI-Powered Negotiation</div>
  <h1>Find Your<br>Next <span>Ride.</span></h1>
  <p class="hero-sub">Browse listings and let our AI negotiate the best price on your behalf. You take over when a deal is reached.</p>
  <div class="hero-stats">
    <div>
      <div class="stat-val" id="statListings">—</div>
      <div class="stat-label">Listings</div>
    </div>
    <div>
      <div class="stat-val">AI</div>
      <div class="stat-label">Negotiation</div>
    </div>
    <div>
      <div class="stat-val">10</div>
      <div class="stat-label">Max Rounds</div>
    </div>
  </div>
</div>

<div class="listings-section">
  <div class="section-header">
    <h2 class="section-title">Available Listings</h2>
    <span class="listings-count" id="listingsCount"></span>
  </div>
  <div id="listingsContainer">
    <div class="loading">
      <div class="loading-spinner"></div>
      Loading listings...
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.6/dist/amazon-cognito-identity.min.js"></script>
<script>
const API = 'https://api.redline.fourallthedogs.com';
const POOL_DATA = {
  UserPoolId: 'us-east-1_gWdcBxpaM',
  ClientId: '7cbn3ild4hjeqna4aipn59qcrm'
};
const userPool = new AmazonCognitoIdentity.CognitoUserPool(POOL_DATA);

const COLOR_MAP = {
  'red': '#e8192c', 'blue': '#2563eb', 'black': '#0f0f0f',
  'white': '#f8f8f8', 'silver': '#c0c0c0', 'gray': '#6b7280',
  'navy': '#1e3a5f', 'green': '#16a34a', 'orange': '#ea580c'
};

function getColorHex(color) {
  return COLOR_MAP[color?.toLowerCase()] || '#c8c8c8';
}

function formatPrice(price) {
  return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(price);
}

function formatMileage(miles) {
  return new Intl.NumberFormat('en-US').format(miles) + ' mi';
}

// Check auth state
window.onload = function() {
  const user = userPool.getCurrentUser();
  if (user) {
    user.getSession((err, session) => {
      if (!err && session.isValid()) {
        user.getUserAttributes((err, attrs) => {
          if (!err) {
            const name = attrs.find(a => a.getName() === 'name');
            if (name) document.getElementById('navUser').textContent = name.getValue();
          }
        });
        document.getElementById('loginBtn').style.display = 'none';
        document.getElementById('logoutBtn').style.display = 'block';
        document.getElementById('navNegotiations').style.display = 'block';
      }
    });
  }
  loadListings();
};

function signOut() {
  const user = userPool.getCurrentUser();
  if (user) user.signOut();
  window.location.reload();
}

async function loadListings() {
  try {
    const res = await fetch(`${API}/listings`);
    const data = await res.json();
    const listings = data.listings;

    document.getElementById('statListings').textContent = listings.length;
    document.getElementById('listingsCount').textContent = `${listings.length} vehicles`;

    const container = document.getElementById('listingsContainer');
    container.innerHTML = `<div class="listings-grid">${listings.map((l, i) => `
      <a class="car-card" href="/listing.html?id=${l.id}" style="animation-delay:${i * 0.05}s">
        <div class="car-image">
          <div class="car-image-placeholder">🚗</div>
          <div class="car-year-badge">${l.year}</div>
        </div>
        <div class="car-body">
          <div class="car-make">${l.make}</div>
          <div class="car-model">${l.model}</div>
          <div class="car-desc">${l.description || ''}</div>
          <div class="car-footer">
            <div class="car-price">${formatPrice(l.price)}</div>
            <div>
              <span class="car-color-dot" style="background:${getColorHex(l.color)}"></span>
              <span class="car-mileage">${formatMileage(l.mileage)}</span>
            </div>
          </div>
        </div>
      </a>
    `).join('')}</div>`;
  } catch(e) {
    document.getElementById('listingsContainer').innerHTML = `
      <div class="error-state">
        <h3>Failed to load listings</h3>
        <p>${e.message}</p>
      </div>`;
  }
}
</script>
</body>
</html>
